schema_version: 1

context:
  version: "2.10.2"

package:
  name: pdal
  version: ${{ version }}

source:
  url: https://github.com/PDAL/PDAL/releases/download/${{ version }}/PDAL-${{ version }}-src.tar.bz2
  sha256: 882b97aa3ae5db682c3b2dc8edef4e29bcc7ecea51c70592e71bc1f34112ad00

build:
  number: 0
  noarch: generic

requirements:
  build:
  host:
  run:
    - libpdal ${{ version }}.*
    - python-pdal
  run_exports:
    - ${{ pin_subpackage('pdal', upper_bound='x.x') }}

tests:
  - script:
      - pdal --version
      - pdal --drivers --debug

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Point Data Abstraction Library (PDAL) meta package
  description: Point cloud data processing library meta package
  homepage: https://www.pdal.io
  repository: https://github.com/pdal/pdal
  documentation: https://pdal.io

extra:
  recipe-maintainers:
    - chambbj
    - hobu
